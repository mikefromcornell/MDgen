name: Portfolio quotes
# Free forever: ~1 min/run on GitHub Actions' free tier (2,000 min/month included).
on:
  schedule:
    - cron: "0 14 * * 1-5"   # 06:00 PT, weekdays (after US market open prep)
  workflow_dispatch: {}       # manual: Actions tab → Portfolio quotes → Run

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch quotes and update portfolio.md + quotes.json
        run: python portfolio-context/scripts/update_quotes.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "no changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add portfolio-context/data/quotes.json portfolio-context/portfolio.md
            git commit -m "chore(quotes): daily update [skip ci]"
            git push
          fi
